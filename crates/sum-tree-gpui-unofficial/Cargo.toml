[package]
name = "sum-tree-gpui-unofficial"
version = "1.27.0"
edition = "2024"
license = "Apache-2.0"
description = "A sum tree data structure, a concurrency-friendly B-tree"
repository = "https://github.com/gpui-archipelago/gpui-unofficial"

[lib]
path = "src/sum_tree.rs"
doctest = false

[dependencies]
heapless = { version = "0.9.2" }
rayon = { version = "1.8" }
ztracing = { package = "ztracing-gpui-unofficial", version = "1.27.0" }
tracing = { version = "0.1.40" }
proptest = { version = "1.12.0", features = ["attr-macro"], optional = true }

[dev-dependencies]
log = { version = "0.4", default-features = false, features = ["std"] }
ctor = { version = "1.0.12" }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
proptest = { version = "1.12.0", features = ["attr-macro"] }
zlog = { package = "zlog-gpui-unofficial", version = "1.27.0" }


[package.metadata.cargo-shear]
ignored = ["tracing"]

[features]
test-support = ["proptest"]
proptest = ["dep:proptest"]

[workspace]
