[package]
name = "zlog-gpui-unofficial"
version = "1.25.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gpui-archipelago/gpui-unofficial"
description = "Unofficial release of Zed's zlog crate"

[lib]
path = "src/zlog.rs"
doctest = false

[features]
default = []

[dependencies]
collections = { package = "collections-gpui-unofficial", version = "1.25.2" }
chrono = { version = "0.4", default-features = true, features = ["std", "serde"] }
log = { version = "0.4", default-features = false, features = ["std", "kv_unstable_std"] }
anyhow = { version = "1.0.86" }

[dev-dependencies]
tempfile = { version = "3.20.0" }

[workspace]
