[package]
name = "path-gpui-unofficial"
version = "1.25.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gpui-archipelago/gpui-unofficial"
description = "Unofficial release of Zed's path crate"

[lib]
path = "src/path.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow = { version = "1.0.86" }
dunce = { version = "1.0" }
serde = { version = "1.0", features = ["rc", "derive"], optional = true }

[target.'cfg(windows)'.dependencies]
tendril = { version = "0.5" }

[dev-dependencies]
tempfile = { version = "3.20.0" }

[workspace]
